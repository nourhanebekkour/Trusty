name: CI

permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings=50 || true

  backend-run:
    name: Backend — Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start backend (smoke test)
        run: |
          npm start &
          SERVER_PID=$!
          sleep 5
          kill $SERVER_PID || true

  frontend-lint:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings=50 || true
      - run: npm run build

  frontend-run:
    name: Frontend — Run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Start frontend (smoke test)
        run: |
          npm run dev &
          SERVER_PID=$!
          sleep 10
          kill $SERVER_PID || true

  frontend-test-report:
    name: Frontend — Tests & Rapport
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Vitest (JSON output)
        run: npm run test:ci
        continue-on-error: true
      - name: Generate HTML report
        run: npm run report:generate
      - name: Send report (email + Jira)
        run: npm run report:send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
          JIRA_BASE_URL:    ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_USER_EMAIL:  ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:   ${{ secrets.JIRA_API_TOKEN }}
      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-report.html

  trivy-scan:
    name: Security — Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — Scan dépendances backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-deps-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — Scan dépendances frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-deps-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — Misconfig Dockerfile backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./backend
          format: sarif
          output: trivy-config-backend.sarif
          exit-code: '0'

      - name: Trivy — Misconfig Dockerfile frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./frontend
          format: sarif
          output: trivy-config-frontend.sarif
          exit-code: '0'

      - name: Build image backend
        run: docker build -t trusty-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t trusty-frontend:ci ./frontend

      - name: Trivy — Scan image backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trusty-backend:ci
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy — Scan image frontend
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: trusty-frontend:ci
          format: sarif
          output: trivy-image-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload — dépendances backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps-backend.sarif
          category: trivy-deps-backend

      - name: Upload — dépendances frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps-frontend.sarif
          category: trivy-deps-frontend

      - name: Upload — config backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-backend.sarif
          category: trivy-config-backend

      - name: Upload — config frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-frontend.sarif
          category: trivy-config-frontend

      - name: Upload — image backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

      - name: Upload — image frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-frontend.sarif
          category: trivy-image-frontend

  # ─── PHASE 6 — appel security.yml après trivy ──────────────────────────────
  security:
    name: Security — SonarQube + OWASP ZAP
    needs: trivy-scan
    uses: ./.github/workflows/security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
