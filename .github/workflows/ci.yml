name: CI — Pipeline complet DevSecOps

# Permissions globales minimales (Least Privilege)
permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches: [mirroring]
  pull_request:
    branches: [mirroring]

jobs:

  # ════════════════════════════════════════════════════════
  # PHASE 1 — QUALITÉ CODE (parallèle backend / frontend)
  # ════════════════════════════════════════════════════════

  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings=50 || true

  frontend-lint:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings=50 || true
      - run: npm run build

  # ════════════════════════════════════════════════════════
  # PHASE 2 — TESTS (parallèle backend / frontend)
  # ════════════════════════════════════════════════════════

  backend-test:
    name: Backend — Test
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: trusty_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trusty_test"
      JWT_SECRET: "secret_test_key"
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

          echo "Waiting for MinIO..."
          until curl -sf http://localhost:9000/minio/health/live; do
            sleep 2
          done
          echo "MinIO ready ✓"

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Generate Swagger
        run: npm run swagger

      - name: Run backend tests
        run: npm test
        continue-on-error: true

  backend-smoke:
    name: Backend — Run
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start backend (smoke test)
        run: |
          npm start &
          SERVER_PID=$!
          sleep 8
          kill $SERVER_PID || true

  frontend-test:
    name: Frontend — Tests & Rapport (Vitest + Jira)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-lint
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Lancer Vitest (JSON output)
        run: npm run test:ci
        continue-on-error: true

      - name: Générer le rapport HTML
        run: npm run report:generate

      - name: Envoyer le rapport (email + Jira)
        run: npm run report:send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
          JIRA_BASE_URL:    ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_USER_EMAIL:  ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:   ${{ secrets.JIRA_API_TOKEN }}

      - name: Archiver le rapport HTML
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-report.html

  # ════════════════════════════════════════════════════════
  # PHASE 3 — SMOKE TESTS (parallèle backend / frontend)
  # ════════════════════════════════════════════════════════

  frontend-run:
    name: Frontend — Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-test
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Démarrer le frontend (smoke test)
        run: |
          npm run dev &
          SERVER_PID=$!
          sleep 10
          kill $SERVER_PID || true

  # ════════════════════════════════════════════════════════
  # PHASE 4 — BUILD IMAGES DOCKER
  # ════════════════════════════════════════════════════════

  build-images:
    name: Build — Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-smoke, frontend-run]
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t trusty-backend:ci ./backend
      - name: Build image frontend
        run: docker build -t trusty-frontend:ci ./frontend

  # ════════════════════════════════════════════════════════
  # PHASE 5 — SÉCURITÉ TRIVY (github-hosted, après build)
  # ════════════════════════════════════════════════════════

  trivy-scan:
    name: Security — Trivy (deps + images Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-smoke, build-images]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — dépendances backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-deps-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — dépendances frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-deps-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — Dockerfile backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./backend
          format: sarif
          output: trivy-config-backend.sarif
          exit-code: '0'

      - name: Trivy — Dockerfile frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./frontend
          format: sarif
          output: trivy-config-frontend.sarif
          exit-code: '0'

      - name: Build image backend
        run: docker build -t trusty-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t trusty-frontend:ci ./frontend

      - name: Trivy — image backend (bloquant si CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: trusty-backend:ci
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — image frontend (bloquant si CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: trusty-frontend:ci
          format: sarif
          output: trivy-image-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload — deps backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps-backend.sarif
          category: trivy-deps-backend

      - name: Upload — deps frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps-frontend.sarif
          category: trivy-deps-frontend

      - name: Upload — config backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-backend.sarif
          category: trivy-config-backend

      - name: Upload — config frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-frontend.sarif
          category: trivy-config-frontend

      - name: Upload — image backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

      - name: Upload — image frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-frontend.sarif
          category: trivy-image-frontend

  # ════════════════════════════════════════════════════════
  # PHASE 6 — SONARQUBE + OWASP ZAP → délégué à security.yml
  # ════════════════════════════════════════════════════════

  security:
    name: Security — SonarQube + OWASP ZAP
    needs: trivy-scan
    uses: ./.github/workflows/security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ════════════════════════════════════════════════════════
  # PHASE 7 — PUSH IMAGES DOCKER HUB (après tous les scans)
