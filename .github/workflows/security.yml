name: Security Checks — Self-Hosted

on:
  workflow_call: {}
  push:
    branches: [main, mirroring, devloppement]
  pull_request:
    branches: [main, mirroring, devloppement]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  sonarqube:
    name: SonarQube — Qualité & sécurité code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: SonarQube ou skip
        run: |
          if ! curl -sf --max-time 5 "http://192.168.20.10:9000/api/system/status" > /dev/null 2>&1; then
            echo "⚠️ SonarQube non accessible — scan ignoré"
            exit 0
          fi
          docker run --rm \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -e SONAR_HOST_URL="http://192.168.20.10:9000" \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.projectKey=Trusty \
            -Dsonar.sources=backend/src,frontend/src \
            -Dsonar.exclusions="**/node_modules/**,**/*.test.js,**/coverage/**" || true

  owasp-zap:
    name: OWASP ZAP — Scan API backend staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: ZAP scan ou skip
        run: |
          if ! curl -sf --max-time 5 "http://192.168.20.10:8091/JSON/core/view/version/" > /dev/null 2>&1; then
            echo "⚠️ ZAP non accessible — scan ignoré"
            exit 0
          fi
          if ! curl -sf --max-time 5 "http://192.168.20.10:3001" > /dev/null 2>&1; then
            echo "⚠️ Backend non accessible — scan ignoré"
            exit 0
          fi
          SCAN_ID=$(curl -s "http://192.168.20.10:8091/JSON/ascan/action/scan/?url=http://192.168.20.10:3001&recurse=true" \
            | grep -o '"scan":"[0-9]*"' | grep -o '[0-9]*') || true
          echo "Scan ID : $SCAN_ID"
          for i in $(seq 1 30); do
            STATUS=$(curl -s "http://192.168.20.10:8091/JSON/ascan/view/status/?scanId=$SCAN_ID" \
              | grep -o '"status":"[0-9]*"' | grep -o '[0-9]*') || true
            echo "Avancement : $STATUS%"
            [ "$STATUS" = "100" ] && break
            sleep 10
          done
          curl -s "http://192.168.20.10:8091/JSON/core/view/alerts/" -o zap-report.json || true
          echo "Alertes : $(grep -c '"alert"' zap-report.json || echo 0)"
          HIGH=$(grep -c '"risk":"High"' zap-report.json || true)
          echo "Alertes HIGH : $HIGH"

      - name: Sauvegarder le rapport ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: zap-report.json
          if-no-files-found: ignore
