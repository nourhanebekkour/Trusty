name: CI — Pipeline complet DevSecOps

# Permissions globales minimales (Least Privilege)
permissions:
  contents: read
  actions: read
  security-events: write

on:
  push:
    branches: [mirroring]
  pull_request:
    branches: [mirroring]

jobs:

  # ════════════════════════════════════════════════════════
  # PHASE 1 — QUALITÉ CODE (parallèle backend / frontend)
  # ════════════════════════════════════════════════════════

  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings=50 || true

  frontend-lint:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --max-warnings=50 || true
      - run: npm run build

  # ════════════════════════════════════════════════════════
  # PHASE 2 — TESTS (parallèle backend / frontend)
  # ════════════════════════════════════════════════════════

  backend-test:
    name: Backend — Tests (Jest + Prisma + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-lint
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: trusty_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trusty_test"
      JWT_SECRET: "secret_test_key"
      MINIO_ENDPOINT: localhost
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Démarrer MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          echo "Waiting for MinIO..."
          until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done
          echo "MinIO ready"

      - name: Migrations Prisma
        run: npx prisma migrate deploy

      - name: Générer Swagger
        run: npm run swagger

      - name: Lancer les tests backend
        run: npm test

  frontend-test:
    name: Frontend — Tests & Rapport (Vitest + Jira)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-lint
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      - name: Lancer Vitest (JSON output)
        run: npm run test:ci
        continue-on-error: true

      - name: Générer le rapport HTML
        run: npm run report:generate

      - name: Envoyer le rapport (email + Jira)
        run: npm run report:send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
          JIRA_BASE_URL:    ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_USER_EMAIL:  ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:   ${{ secrets.JIRA_API_TOKEN }}

      - name: Archiver le rapport HTML
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-report.html

  # ════════════════════════════════════════════════════════
  # PHASE 3 — SMOKE TESTS (parallèle backend / frontend)
  # ════════════════════════════════════════════════════════

  backend-run:
    name: Backend — Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-test
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Démarrer le backend (smoke test)
        run: |
          npm start &
          SERVER_PID=$!
          sleep 5
          kill $SERVER_PID || true

  frontend-run:
    name: Frontend — Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-test
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Démarrer le frontend (smoke test)
        run: |
          npm run dev &
          SERVER_PID=$!
          sleep 10
          kill $SERVER_PID || true

  # ════════════════════════════════════════════════════════
  # PHASE 4 — SÉCURITÉ TRIVY (github-hosted, après smoke)
  # ════════════════════════════════════════════════════════

  trivy-scan:
    name: Security — Trivy (deps + images Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-run, frontend-run]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      # --- Scan des dépendances npm ---
      - name: Trivy — dépendances backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-deps-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — dépendances frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: sarif
          output: trivy-deps-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      # --- Scan des Dockerfiles ---
      - name: Trivy — Dockerfile backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./backend
          format: sarif
          output: trivy-config-backend.sarif
          exit-code: '0'

      - name: Trivy — Dockerfile frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ./frontend
          format: sarif
          output: trivy-config-frontend.sarif
          exit-code: '0'

      # --- Build + scan des images Docker ---
      - name: Build image backend
        run: docker build -t trusty-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t trusty-frontend:ci ./frontend

      - name: Trivy — image backend (bloquant si CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trusty-backend:ci
          format: sarif
          output: trivy-image-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy — image frontend (bloquant si CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          image-ref: trusty-frontend:ci
          format: sarif
          output: trivy-image-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      # --- Upload résultats vers GitHub Security tab ---
      - name: Upload — deps backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps-backend.sarif
          category: trivy-deps-backend

      - name: Upload — deps frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps-frontend.sarif
          category: trivy-deps-frontend

      - name: Upload — config backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-backend.sarif
          category: trivy-config-backend

      - name: Upload — config frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config-frontend.sarif
          category: trivy-config-frontend

      - name: Upload — image backend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-backend.sarif
          category: trivy-image-backend

      - name: Upload — image frontend
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image-frontend.sarif
          category: trivy-image-frontend

  # ════════════════════════════════════════════════════════
  # PHASE 5 — SONARQUBE + OWASP ZAP (self-hosted, après Trivy)
  # ════════════════════════════════════════════════════════

  sonarqube:
    name: SonarQube — Qualité & sécurité code
    runs-on: self-hosted
    timeout-minutes: 20
    needs: trivy-scan
    steps:
      - name: Checkout du code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0

      - name: Analyse SonarQube
        uses: sonarsource/sonarqube-scan-action@bfd8f9dd3606f9b76fb20577e3736cfd5f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://192.168.20.10:9000

  owasp-zap:
    name: OWASP ZAP — Scan API backend staging
    runs-on: self-hosted
    timeout-minutes: 20
    needs: trivy-scan
    steps:
      - name: Checkout du code
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29

      - name: Scan actif ZAP sur le backend staging
        run: |
          SCAN_ID=$(curl -s "http://192.168.20.10:8090/JSON/ascan/action/scan/?url=http://192.168.20.10:3001&recurse=true" \
            | grep -o '"scan":"[0-9]*"' | grep -o '[0-9]*')
          echo "Scan ID : $SCAN_ID"
          for i in $(seq 1 30); do
            STATUS=$(curl -s "http://192.168.20.10:8090/JSON/ascan/view/status/?scanId=$SCAN_ID" \
              | grep -o '"status":"[0-9]*"' | grep -o '[0-9]*')
            echo "Avancement : $STATUS%"
            if [ "$STATUS" = "100" ]; then break; fi
            sleep 10
          done
          curl -s "http://192.168.20.10:8090/JSON/core/view/alerts/" -o zap-report.json
          echo "Alertes trouvées : $(cat zap-report.json | grep -c '"alert"' || echo 0)"

      - name: Sauvegarder le rapport ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.sha }}
          path: zap-report.json

      - name: Vérifier les alertes HIGH / CRITICAL
        run: |
          HIGH=$(cat zap-report.json | grep -c '"risk":"High"' || true)
          if [ "$HIGH" -gt "0" ]; then
            echo "$HIGH alerte(s) HIGH — pipeline bloqué"
            exit 1
          fi
          echo "Aucune alerte critique ZAP"
