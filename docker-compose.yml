
services:

# ──────────────── SERVICE FRONTEND ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - reseau_app
    depends_on:
      - backend

 
 # ──────────────── SERVICE BACKEND ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - reseau_app
    depends_on:
      database:
        condition: service_healthy  


# ──────────────── SERVICE DB ────────────────
  database:
    image: postgres:16-alpine
    networks:
      - reseau_app
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s       
      timeout: 5s    
      retries: 5   

# ──────────────── SERVICE MINIO ────────────────
  minio:
    image: minio/minio:latest
    networks:
      - reseau_app
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

# ───────────────── RÉSEAU INTERNE entre les services  ───────────────── 

networks:       
  reseau_app:  
    driver: bridge  

volumes:
  donnees_postgres:
  minio_data:
