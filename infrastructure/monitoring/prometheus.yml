global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'trusty-backend'
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'gitlab'
    static_configs:
      - targets: ['gitlab:8929']
